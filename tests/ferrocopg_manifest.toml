[[rules]]
glob = "tests/pq/*"
tag = "pgconn"
reason = "pq tests assert raw libpq wrapper behavior"
action = "skip"

[[rules]]
glob = "tests/test_prepared.py::test_deallocate_or_close"
tag = "pgconn"
reason = "the test asserts raw libpq close/deallocate debug calls; Rust deallocation is covered by server-visible LRU tests"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_context_active_rollback_no_clobber"
tag = "pgconn"
reason = "the test enters COPY through raw PGconn.exec_ protocol state"
action = "skip"

[[rules]]
glob = "tests/pool/*_async.py::*"
tag = "async"
reason = "pool backend injection is outside the AsyncConnection fixture switch"
action = "skip"

[[rules]]
glob = "tests/crdb/*_async.py::*"
tag = "async"
reason = "CRDB async fixture injection is outside the initial sync release contract"
action = "skip"

[[rules]]
glob = "tests/test_cursor_async.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete async cursors require libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_client_async.py::*"
tag = "concrete-cursor"
reason = "AsyncClientCursor requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_common_async.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete async cursor factories are a libpq-only boundary"
action = "skip"

[[rules]]
glob = "tests/test_cursor_raw_async.py::*"
tag = "concrete-cursor"
reason = "AsyncRawCursor requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_copy.py::test_worker_error_propagated"
tag = "libpq-writer"
reason = "the test monkeypatches the libpq copy_to generator to assert its worker error path"
action = "skip"

[[rules]]
glob = "tests/test_pipeline.py::test_pipeline_exit_sync_trace"
tag = "pgconn-trace"
reason = "wire-level Sync assertions require raw libpq PGconn.trace()"
action = "skip"

[[rules]]
glob = "tests/test_pipeline.py::test_pipeline_nested_sync_trace"
tag = "pgconn-trace"
reason = "wire-level Sync assertions require raw libpq PGconn.trace()"
action = "skip"

[[rules]]
glob = "tests/test_pipeline.py::test_executemany_trace*"
tag = "pgconn-trace"
reason = "wire-level roundtrip assertions require raw libpq PGconn.trace()"
action = "skip"

[[rules]]
glob = "tests/test_pipeline.py::test_transaction_state_implicit_begin"
tag = "pgconn-trace"
reason = "wire-level Parse assertions require raw libpq PGconn.trace()"
action = "skip"

[[rules]]
glob = "tests/test_pipeline_async.py::*"
tag = "pipeline"
reason = "Rust-native async pipeline parity is outside the initial sync release contract"

[[rules]]
glob = "tests/test_connection.py::*fileno*"
tag = "fileno"
reason = "raw socket access is a documented ferrocopg boundary"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::*fileno*"
tag = "fileno"
reason = "raw socket access is a documented ferrocopg boundary"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_error_single_host_original_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout does not cover a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_error_multi_hosts_each_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres does not aggregate libpq-style per-host connection errors"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_multi_attempt_pgconn*"
tag = "handshake-timeout"
reason = "libpq multi-attempt PGconn error aggregation is unavailable"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_timeout*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout does not cover a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_multi_hosts*"
tag = "handshake-timeout"
reason = "rust-postgres cannot advance after a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_cancel_safe_timeout*"
tag = "handshake-timeout"
reason = "rust-postgres cancel_query does not expose libpq 17 bounded cancel-safe handshake semantics"
action = "skip"

[[rules]]
glob = "tests/test_waiting.py::test_wait_remote_closed*"
tag = "pgconn-socket"
reason = "direct PGconn.send_query(), generator, and socket waiting require raw libpq access"
action = "skip"
