[[rules]]
glob = "tests/pq/*"
tag = "pgconn"
reason = "pq tests assert raw libpq wrapper behavior"
action = "skip"

[[rules]]
glob = "tests/pool/*_async.py::*"
tag = "async"
reason = "pool backend injection is outside the AsyncConnection fixture switch"
action = "skip"

[[rules]]
glob = "tests/crdb/*_async.py::*"
tag = "async"
reason = "AsyncConnection parity is tracked in Milestone 3.7"
action = "skip"

[[rules]]
glob = "tests/test_cursor.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete cursors currently require libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_client.py::*"
tag = "concrete-cursor"
reason = "ClientCursor currently requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_common.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete cursor factories are a documented libpq-only boundary"
action = "skip"

[[rules]]
glob = "tests/test_cursor_raw.py::*"
tag = "concrete-cursor"
reason = "RawCursor currently requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_async.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete async cursors require libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_client_async.py::*"
tag = "concrete-cursor"
reason = "AsyncClientCursor requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_common_async.py::*"
tag = "concrete-cursor"
reason = "Psycopg concrete async cursor factories are a libpq-only boundary"
action = "skip"

[[rules]]
glob = "tests/test_cursor_raw_async.py::*"
tag = "concrete-cursor"
reason = "AsyncRawCursor requires libpq connection internals"
action = "skip"

[[rules]]
glob = "tests/test_cursor_common.py::*server*"
tag = "concrete-cursor"
reason = "these cases directly construct Psycopg concrete server cursor classes"
action = "skip"

[[rules]]
glob = "tests/test_cursor_server.py::*"
tag = "concrete-cursor"
reason = "this module directly constructs ServerCursor and RawServerCursor"
action = "skip"

[[rules]]
glob = "tests/test_copy.py::test_worker*"
tag = "libpq-writer"
reason = "LibpqWriter and QueuedLibpqWriter require a real PGconn"
action = "skip"

[[rules]]
glob = "tests/test_copy.py::test_connection_writer*"
tag = "libpq-writer"
reason = "LibpqWriter requires libpq generator and PGconn internals"
action = "skip"

[[rules]]
glob = "tests/test_pipeline.py::*"
tag = "pipeline"
reason = "full pipeline semantics are tracked in Milestone 3.6"

[[rules]]
glob = "tests/test_pipeline_async.py::*"
tag = "pipeline"
reason = "exact libpq pipeline sync and PIPELINE_ABORTED semantics are a boundary"

[[rules]]
glob = "tests/test_connection.py::*fileno*"
tag = "fileno"
reason = "raw socket access is a documented ferrocopg boundary"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::*fileno*"
tag = "fileno"
reason = "raw socket access is a documented ferrocopg boundary"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_connect_error_single_host_original_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout covers socket establishment, not a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_error_single_host_original_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout does not cover a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_connect_error_multi_hosts_each_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres does not aggregate libpq-style per-host connection errors"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_error_multi_hosts_each_message_preserved*"
tag = "handshake-timeout"
reason = "rust-postgres does not aggregate libpq-style per-host connection errors"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_multi_attempt_pgconn*"
tag = "handshake-timeout"
reason = "libpq multi-attempt PGconn error aggregation is unavailable"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_multi_attempt_pgconn*"
tag = "handshake-timeout"
reason = "libpq multi-attempt PGconn error aggregation is unavailable"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_connect_timeout*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout covers socket establishment, not a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_connect_timeout*"
tag = "handshake-timeout"
reason = "rust-postgres connect_timeout does not cover a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_connection.py::test_multi_hosts*"
tag = "handshake-timeout"
reason = "rust-postgres cannot advance to another host while the first PostgreSQL handshake is stalled"
action = "skip"

[[rules]]
glob = "tests/test_connection_async.py::test_multi_hosts*"
tag = "handshake-timeout"
reason = "rust-postgres cannot advance after a stalled PostgreSQL handshake"
action = "skip"

[[rules]]
glob = "tests/test_concurrency.py::test_break_attempts*"
tag = "handshake-timeout"
reason = "interrupting a stalled libpq connection attempt is outside the Rust adapter contract"
action = "skip"
