[package]
name = "ferrocopg-postgres"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "ferrocopg backend layer built on rust-postgres"

[dependencies]
fallible-iterator = "0.2"
postgres = { version = "0.19.13", features = ["with-time-0_3", "with-uuid-1"] }
rustls = "0.23.41"
rustls-native-certs = "0.8.4"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio-postgres = { version = "0.7.17", features = ["with-time-0_3", "with-uuid-1"] }
tokio-postgres-rustls = "0.14.0"
uuid = "1"
