[workspace]
members = ["crates/ferrocopg-postgres", "crates/ferrocopg-python"]
exclude = ["vendor/postgres", "vendor/tokio-postgres"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "LGPL-3.0-only"
authors = ["Daniele Varrazzo <daniele.varrazzo@gmail.com>"]

[patch.crates-io]
postgres = { path = "vendor/postgres" }
tokio-postgres = { path = "vendor/tokio-postgres" }
