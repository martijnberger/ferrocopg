name: Phase 5 reliability and performance

on:
  workflow_dispatch:
    inputs:
      codegen_experiment:
        description: 'Run a diagnostic default/ThinLTO comparison, NOT release acceptance'
        type: boolean
        default: false
      comparison_baseline:
        description: 'Full baseline commit SHA for a candidate comparison, NOT release acceptance'
        type: string
        default: ''
      attribution:
        description: 'Run dedicated layer/workload attribution, NOT release acceptance'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'tools/phase5/**'
      - '.github/workflows/phase5.yml'

permissions:
  contents: read

concurrency:
  group: phase5-${{ github.ref }}${{ inputs.attribution && '-attribution' || '' }}
  cancel-in-progress: false

jobs:
  installed-package:
    if: ${{ !inputs.attribution && !inputs.codegen_experiment && !inputs.comparison_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        mode: [benchmark, soak]
    env:
      PHASE5_DSN: host=127.0.0.1 user=postgres password=password dbname=postgres sslmode=disable
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start TLS-enabled PostgreSQL
        run: |
          docker pull postgres:18
          sh tools/ci/ci_make_ferrocopg_tls_certs.sh .ci-tls
          postgres_uid=$(docker run --rm postgres:18 id -u postgres)
          sudo chown "$postgres_uid" .ci-tls/server.key
          docker run --rm -d --name phase5-postgres -p 5432:5432 \
            -v "$PWD/.ci-tls:/tls:ro" -e POSTGRES_PASSWORD=password postgres:18 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          docker image inspect postgres:18 > phase5-server.json
          for attempt in $(seq 1 60); do
            if docker exec phase5-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs phase5-postgres
          exit 1
      - name: Build and install the release wheel and official comparators
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          uv sync --locked --no-default-groups --group rust
          uv run --no-sync python tools/stage_ferrocopg.py /tmp/phase5-stage
          cd /tmp/phase5-stage
          "$GITHUB_WORKSPACE/.venv/bin/maturin" build --release --out /tmp/phase5-wheels
          cd "$GITHUB_WORKSPACE"
          uv venv /tmp/phase5-env --python 3.14
          uv pip install --python /tmp/phase5-env/bin/python \
            -r tools/phase5/requirements.txt /tmp/phase5-wheels/*.whl
          sha256sum /tmp/phase5-wheels/*.whl > phase5-wheel.sha256
      - name: Check acceptance accounting
        run: /tmp/phase5-env/bin/python -m unittest discover -s tools/phase5 -v
      - name: Record runner processes before measurement
        run: ps -eo pid,ppid,pcpu,comm > phase5-processes-before.log
      - name: Run three complete benchmarks on this runner
        if: matrix.mode == 'benchmark'
        run: |
          /tmp/phase5-env/bin/python tools/phase5/repeat_benchmark.py \
            --revision "$GITHUB_SHA" --wheel /tmp/phase5-wheels/*.whl \
            --output phase5-results
      - name: Run full installed-package soak
        if: matrix.mode == 'soak'
        run: |
          /tmp/phase5-env/bin/python tools/phase5/run.py soak \
            --revision "$GITHUB_SHA" --output phase5-results \
            --seconds 1800 --iterations 20 --samples 9 --rows 1000 --timeout 2400
      - name: Collect server diagnostics
        if: always()
        run: |
          ps -eo pid,ppid,pcpu,comm > phase5-processes-after.log
          docker logs phase5-postgres > phase5-postgres.log 2>&1
      - name: Publish measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-${{ matrix.mode }}-${{ github.sha }}
          retention-days: 90
          path: |
            phase5-results/
            phase5-postgres.log
            phase5-server.json
            phase5-wheel.sha256
            phase5-processes-*.log
            /tmp/phase5-wheels/*.whl
          if-no-files-found: error

  codegen-experiment:
    if: ${{ !inputs.attribution && (inputs.codegen_experiment || inputs.comparison_baseline) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE5_DSN: host=127.0.0.1 user=postgres password=password dbname=postgres sslmode=disable
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - uses: actions/checkout@v6
      - name: Validate candidate comparison identity
        if: inputs.comparison_baseline
        env:
          BASELINE_REVISION: ${{ inputs.comparison_baseline }}
        run: '[[ "$BASELINE_REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        if: inputs.comparison_baseline
        with:
          ref: ${{ inputs.comparison_baseline }}
          path: .phase5-baseline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start the dedicated TLS-enabled PostgreSQL server
        run: |
          docker pull postgres:18
          sh tools/ci/ci_make_ferrocopg_tls_certs.sh .ci-tls
          postgres_uid=$(docker run --rm postgres:18 id -u postgres)
          sudo chown "$postgres_uid" .ci-tls/server.key
          docker run --rm -d --name phase5-postgres -p 5432:5432 \
            -v "$PWD/.ci-tls:/tls:ro" -e POSTGRES_PASSWORD=password postgres:18 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          docker image inspect postgres:18 > phase5-codegen-server.json
          for attempt in $(seq 1 60); do
            if docker exec phase5-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs phase5-postgres
          exit 1
      - name: Prepare build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          uv sync --locked --no-default-groups --group rust
      - name: Compare experimental wheels on this runner (not acceptance)
        env:
          BASELINE_REVISION: ${{ inputs.comparison_baseline }}
        run: |
          args=()
          if [[ -n "$BASELINE_REVISION" ]]; then
            args=(--baseline-source "$GITHUB_WORKSPACE/.phase5-baseline" --baseline-revision "$BASELINE_REVISION")
          fi
          uv run --no-sync python tools/phase5/codegen_compare.py \
            --revision "$GITHUB_SHA" --output phase5-codegen-results "${args[@]}"
      - name: Collect server diagnostics
        if: always()
        run: docker logs phase5-postgres > phase5-codegen-postgres.log 2>&1
      - name: Publish experimental wheels, measurements, and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-${{ inputs.comparison_baseline && 'candidate' || 'codegen' }}-experiment-${{ github.sha }}
          retention-days: 90
          path: |
            phase5-codegen-results/
            phase5-codegen-server.json
            phase5-codegen-postgres.log
          if-no-files-found: error

  attribution:
    if: ${{ inputs.attribution }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE5_DSN: host=127.0.0.1 user=postgres password=password dbname=postgres sslmode=disable
      RUSTUP_TOOLCHAIN: 1.94.1
    steps:
      - name: Reject ambiguous diagnostic requests
        if: ${{ inputs.codegen_experiment || inputs.comparison_baseline }}
        run: exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start dedicated TLS-enabled PostgreSQL
        run: |
          docker pull postgres:18
          sh tools/ci/ci_make_ferrocopg_tls_certs.sh .ci-tls
          postgres_uid=$(docker run --rm postgres:18 id -u postgres)
          sudo chown "$postgres_uid" .ci-tls/server.key
          docker run --rm -d --name phase5-postgres -p 5432:5432 \
            -v "$PWD/.ci-tls:/tls:ro" -e POSTGRES_PASSWORD=password postgres:18 \
            -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
          docker image inspect postgres:18 > phase5-attribution-server.json
          for attempt in $(seq 1 60); do
            if docker exec phase5-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs phase5-postgres
          exit 1
      - name: Build all artifacts before measurement
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev strace
          uv sync --locked --no-default-groups --group rust
          uv run --no-sync python tools/stage_ferrocopg.py /tmp/phase5-attribution-stage
          cd /tmp/phase5-attribution-stage
          "$GITHUB_WORKSPACE/.venv/bin/maturin" build --release --locked --out /tmp/phase5-attribution-wheels
          cd "$GITHUB_WORKSPACE"
          cargo build --release --locked --offline -p ferrocopg-postgres --example layer_probe
          cc -O3 -Wall -Wextra -Werror "-I$(pg_config --includedir)" \
            "-L$(pg_config --libdir)" tools/phase5/libpq_probe.c -lpq -o /tmp/phase5-libpq-probe
          uv venv /tmp/phase5-attribution-env --python 3.14
          uv pip install --python /tmp/phase5-attribution-env/bin/python \
            -r tools/phase5/requirements-attribution.txt /tmp/phase5-attribution-wheels/*.whl
          /tmp/phase5-attribution-env/bin/python -m unittest discover -s tools/phase5 -v
          uv pip freeze --python /tmp/phase5-attribution-env/bin/python > phase5-attribution-packages.txt
          strace --version > phase5-attribution-strace-version.txt
      - name: Record runner processes before measurement
        run: ps -eo pid,ppid,pcpu,comm > phase5-attribution-processes-before.log
      - name: Run sequential timing and instrumentation phases
        run: |
          /tmp/phase5-attribution-env/bin/python tools/phase5/attribution.py \
            --revision "$GITHUB_SHA" --wheel /tmp/phase5-attribution-wheels/*.whl \
            --native-rust "$GITHUB_WORKSPACE/target/release/examples/layer_probe" \
            --native-libpq /tmp/phase5-libpq-probe --output phase5-attribution-results
      - name: Collect attribution diagnostics
        if: always()
        run: |
          ps -eo pid,ppid,pcpu,comm > phase5-attribution-processes-after.log
          docker logs phase5-postgres > phase5-attribution-postgres.log 2>&1
      - name: Publish attribution evidence (not acceptance)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-attribution-${{ github.sha }}
          retention-days: 90
          path: |
            phase5-attribution-results/
            phase5-attribution-*.json
            phase5-attribution-*.log
            phase5-attribution-*.txt
            /tmp/phase5-attribution-wheels/*.whl
            /tmp/phase5-libpq-probe
            target/release/examples/layer_probe
          if-no-files-found: error
